server:
  port: 8080
  servlet:
    context-path: /library

spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=LibraryDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: "0211205"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: VmVyeVNlY3JldEtleUZvckxpYnJhcnlNYW5hZ2VtZW50U3lzdGVtQDIwMjQhQCMk
  expiration: 86400000

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}"
  media:
    upload-dir: "${MEDIA_UPLOAD_DIR:./uploads/media}"
  membership:
    free-code: "${MEMBERSHIP_FREE_CODE:FREE}"
    default-paid-code: "${MEMBERSHIP_DEFAULT_PAID_CODE:PREMIUM}"
    subscription-days: "${MEMBERSHIP_SUBSCRIPTION_DAYS:30}"
  vnpay:
    pay-url: "${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
    tmn-code: "${VNPAY_TMN_CODE:P5KY7N8A}"
    hash-secret: "${VNPAY_HASH_SECRET:S9YV2ADXYSYBCQVMGEIGSM3UTI0VS0OH}"
    return-url: "${VNPAY_RETURN_URL:http://localhost:8080/library/api/payments/vnpay/return}"
    ipn-url: "${VNPAY_IPN_URL:http://localhost:8080/library/api/payments/vnpay/ipn}"
    frontend-return-url: "${FRONTEND_RETURN_URL:http://localhost:5174/reader/card}"
